<!DOCTYPE html>
<html lang="bn">
<head>
    <meta name="google-site-verification" content="JibFTex5VrU3ZxcZvxIz3nBAFQNScH55IhD-t_VVBt4" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Accessories Radio - Zero-Signal Live Stream</title>
    
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://arradio.shop/">
    <meta property="og:title" content="Accessories Roy Live Radio Network">
    <meta property="og:description" content="Auto-connecting zero-bandwidth live radio stream.">
    <meta property="og:image" content="https://i.ibb.co/XT5FbLK/558696382-1445472990075070-3199879849015044106-n.jpg">
    
    <link rel="icon" type="image/x-icon" href="https://i.ibb.co/XT5FbLK/558696382-1445472990075070-3199879849015044106-n.jpg">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html {
            width: 100%; height: 100%;
            background: #0f172a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; justify-content: center; align-items: center; color: #f8fafc;
        }

        .radio-card {
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            width: 90%; max-width: 360px; min-height: 420px;
            background: #1e293b; border: 1px solid #334155; border-radius: 24px; padding: 25px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); text-align: center;
            gap: 15px;
        }

        .radio-title { font-size: 20px; font-weight: 700; color: #38bdf8; margin-bottom: 6px; }
        .badge {
            display: inline-block; font-size: 12px; padding: 4px 12px; border-radius: 20px;
            background: #334155; color: #94a3b8; transition: all 0.3s;
        }
        .badge.live {
            background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4);
        }
        .badge.reconnecting {
            background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.4);
        }

        .control-btn {
            width: 90px; height: 90px; border-radius: 50%; border: none;
            background: linear-gradient(135deg, #059669, #10b981); color: white; font-size: 36px;
            display: flex; justify-content: center; align-items: center; cursor: pointer;
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4); transition: transform 0.2s;
        }
        .control-btn:active { transform: scale(0.95); }

        .info-box {
            font-size: 12px; color: #94a3b8; background: #0f172a;
            padding: 12px; border-radius: 12px; width: 100%;
        }

        .download-btn {
            display: block;
            width: 100%;
            padding: 10px 14px;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: #ffffff;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
            transition: all 0.3s ease;
            line-height: 1.4;
        }

        .download-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="radio-card">
        <div>
            <div class="radio-title">ACCESSORIES RADIO</div>
            <p style="font-size: 13px; color: #94a3b8; margin-bottom: 10px;">জিরো-সিগন্যাল অটো প্লেয়ার</p>
            <div id="status-badge" class="badge">টিউনিং হচ্ছে...</div>
        </div>

        <button id="play-btn" class="control-btn">▶</button>

        <div class="info-box" id="info-text">
            একবার প্লে চাপুন, সিগন্যাল চলে গেলেও ব্যাকগ্রাউন্ডে অটো-কানেক্ট হতে থাকবে।
        </div>

        <a href="Https://www.webtonative.com/api/v1/demo/download/6a72fef30200a1eb04dc6ace/ANDROID?t=1785922070537" class="download-btn" target="_blank">
            📱 CLICK download and install
        </a>
    </div>

    <script>
        const RADIO_HOST_ID = 'low_bw_radio_station_node_1';
        let peer = null;
        let activeCall = null;
        let isUserActivated = false;
        let autoReconnectTimer = null;

        const playBtn = document.getElementById('play-btn');
        const statusBadge = document.getElementById('status-badge');
        const infoText = document.getElementById('info-text');

        // পিয়ার সংযোগ তৈরি
        function initPeer() {
            if (peer) return;

            peer = new Peer({
                config: { 'iceServers': [{ urls: 'stun:stun.l.google.com:19302' }] }
            });

            peer.on('open', () => {
                if (isUserActivated && !activeCall) {
                    startAutoConnectionLoop();
                } else if (!isUserActivated) {
                    statusBadge.innerText = "প্লে বোতামে চাপ দিন";
                }
            });

            peer.on('error', (err) => {
                console.log("Peer Connection Error:", err.type);
                // যেকোনো কানেকশন এরর হলে ৩ সেকেন্ড পর অটো রিট্রাই করবে
                scheduleReconnect();
            });

            peer.on('disconnected', () => {
                scheduleReconnect();
            });
        }

        // ব্যবহারকারী প্লে বোতাম টিপলে এক্টিভ হবে
        playBtn.addEventListener('click', () => {
            isUserActivated = true;
            if (!peer || peer.destroyed) {
                initPeer();
            } else {
                startAutoConnectionLoop();
            }
        });

        // অটো কানেক্ট লুপ
        function startAutoConnectionLoop() {
            if (!isUserActivated) return;

            statusBadge.innerText = "কানেক্ট করা হচ্ছে...";
            statusBadge.className = "badge reconnecting";
            infoText.innerText = "সিগন্যাল খোঁজা হচ্ছে...";

            attemptCall();
        }

        // স্টুডিওতে কল করার চেষ্টা
        function attemptCall() {
            if (!peer || peer.disconnected) {
                scheduleReconnect();
                return;
            }

            // আগের কোনো কল থাকলে তা বন্ধ করা
            if (activeCall) {
                activeCall.close();
            }

            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const dest = ctx.createMediaStreamDestination();

            activeCall = peer.call(RADIO_HOST_ID, dest.stream);

            if (activeCall) {
                let connected = false;

                activeCall.on('stream', remoteStream => {
                    connected = true;
                    clearTimeout(autoReconnectTimer);

                    const audio = new Audio();
                    audio.srcObject = remoteStream;
                    audio.play().catch(e => console.log("Auto-play prevented", e));

                    playBtn.innerText = "🔊";
                    statusBadge.innerText = "LIVE 🔴";
                    statusBadge.className = "badge live";
                    infoText.innerText = "লাইভ অডিও চালু আছে। নেটওয়ার্ক কমলেও সমস্যা নেই।";
                });

                activeCall.on('close', () => {
                    scheduleReconnect();
                });

                activeCall.on('error', () => {
                    scheduleReconnect();
                });

                // 3 সেকেন্ডের মধ্যে অডিও না আসলে পুনরায় কানেক্ট করার চেষ্টা
                setTimeout(() => {
                    if (!connected && isUserActivated) {
                        scheduleReconnect();
                    }
                }, 3000);

            } else {
                scheduleReconnect();
            }
        }

        // ৩ সেকেন্ড পর পর স্বয়ংক্রিয় রিট্রাই লজিক
        function scheduleReconnect() {
            if (!isUserActivated) return;

            statusBadge.innerText = "পুনরায় কানেক্ট হচ্ছে...";
            statusBadge.className = "badge reconnecting";
            infoText.innerText = "নেটওয়ার্ক দুর্বল! সিস্টেম একা একাই ট্রাই করছে, অপেক্ষা করুন...";

            clearTimeout(autoReconnectTimer);
            autoReconnectTimer = setTimeout(() => {
                attemptCall();
            }, 3000);
        }

        // পেজ লোড হওয়ার সাথে সাথে পিয়ার প্রস্তুত রাখা
        window.addEventListener('load', initPeer);
    </script>
</body>
</html>
