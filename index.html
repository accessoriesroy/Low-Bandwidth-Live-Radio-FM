    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html {
            width: 100%; height: 100%;
            background: #0f172a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; justify-content: center; align-items: center; color: #f8fafc;
        }

        .radio-card {
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            width: 90%; max-width: 360px; min-height: 420px;
            background: #1e293b; border: 1px solid #334155; border-radius: 24px; padding: 25px;

        }

        .radio-title { font-size: 20px; font-weight: 700; color: #38bdf8; margin-bottom: 6px; }
        .badge {
            display: inline-block; font-size: 12px; padding: 4px 12px; border-radius: 20px;
            background: #334155; color: #94a3b8;
        }
        .badge.live {
            background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4);
        }

        .control-btn {
            width: 90px !important;

            min-height: 90px !important;
            border-radius: 50% !important;
            border: none !important;
            background: linear-gradient(135deg, #10b981, #059669) !important;
            color: #ffffff !important;
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            cursor: pointer !important;
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.6), inset 0 0 10px rgba(255, 255, 255, 0.3) !important;
            transition: all 0.3s ease !important;
            margin: 15px auto !important;
            outline: none !important;
        }

        .control-btn:hover {
            transform: scale(1.08) !important;
            box-shadow: 0 0 35px rgba(16, 185, 129, 0.8), inset 0 0 15px rgba(255, 255, 255, 0.5) !important;
        }

        .control-btn:active {
            transform: scale(0.95) !important;
        }

        .control-btn svg, .control-btn i {
            width: 40px !important;
            height: 40px !important;
            fill: #ffffff !important;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)) !important;
        }

        .info-box {
            font-size: 12px; color: #94a3b8; background: #0f172a;
            padding: 12px; border-radius: 12px; width: 100%;
        }

        .radio-notice-ticker {
            width: 100% !important;
            background: rgba(15, 23, 42, 0.6) !important;
            border: 1px solid rgba(56, 189, 248, 0.3) !important;
            border-radius: 20px !important;
            padding: 6px 12px !important;
            margin-bottom: 12px !important;
            overflow: hidden !important;
            display: flex !important;
            align-items: center !important;
            box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.4) !important;
        }

        .radio-notice-ticker marquee {
            color: #38bdf8 !important;
            font-size: 12px !important;
            font-weight: 500 !important;
            line-height: 1.2 !important;
            display: block !important;
        }

        .radio-ad-banner {
            width: 100%;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 1px dashed #38bdf866;
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 15px;
            text-align: center;
            cursor: pointer;
        }
        .ad-badge { font-size: 8px; background: #ef4444; color: white; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .ad-title-text { font-size: 12px; color: #f8fafc; font-weight: bold; margin-top: 4px; }
        .ad-subtitle-text { font-size: 10px; color: #94a3b8; margin-top: 2px; }

        .install-pwa-btn {
            display: none;
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            background: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        .install-pwa-btn:hover {
            background: #0284c7;
            color: #ffffff;
        }
    </style>

<body>

    <div class="radio-card">
        <div class="radio-notice-ticker">
            <marquee behavior="scroll" direction="left" scrollamount="4">
                📢 Welcome to the official online radio of Accessories Roy!
            </marquee>
        </div>

        <div class="radio-ad-banner" onclick="window.open('https://accessoriesroy.in', '_blank')">
            <span class="ad-badge">ADVERTISEMENT</span>
            <div class="ad-title-text">🛍️ 20% OFF on Mobile & Computer Accessories!</div>
            <div class="ad-subtitle-text">Click here to order (accessoriesroy.in)</div>
        </div>

        <div>
            <div class="radio-title">ACCESSORIES RADIO</div>
            <p style="font-size: 13px; color: #94a3b8; margin-bottom: 10px;">Live Broadcasting Network</p>
            <div id="status-badge" class="badge">Tuning in...</div>
        </div>

        <button id="play-btn" class="control-btn">▶</button>

        <div class="info-box" id="info-text">
            Press the play button to listen live even on 2G networks.
        </div>

        <a href="https://www.webtonative.com/api/v1/demo/download/6a72fef30200a1eb04dc6ace/ANDROID?t=1786292802553" download style="
            display: block;
            width: 100%;
            margin-top: 15px;
            padding: 10px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3);
        ">📲 Download App (APK)</a>

        <button id="installBtn" class="install-pwa-btn">📲 Add App Icon to Home Screen</button>
    </div>

    <audio id="radio-audio-element" playsinline style="display:none;"></audio>

    <script>
        const RADIO_HOST_ID = 'low_bw_radio_station_node_1';
        let peer = null;
        let currentCall = null;
        let isUserPlaying = false;
        let isConnectingProcess = false;

        // Recording and Cache Variables
        let mediaRecorder = null;
        let cachedChunks = [];
        let isPlayingBackup = false;
        let backupObjectURL = null;

        const playBtn = document.getElementById('play-btn');
        const statusBadge = document.getElementById('status-badge');
        const infoText = document.getElementById('info-text');
        const audioElement = document.getElementById('radio-audio-element');

        function setupMediaSession() {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: 'Accessories Radio 96.0 FM',
                    artist: 'Accessories Roy Live',
                    album: 'Live Stream',
                    artwork: [
                        { src: 'https://i.ibb.co/XT5FbLK/558696382-1445472990075070-3199879849015044106-n.jpg', sizes: '512x512', type: 'image/jpeg' }
                    ]
                });

                navigator.mediaSession.setActionHandler('play', () => {
                    audioElement.play();
                    playBtn.innerText = "🔊";
                });
                navigator.mediaSession.setActionHandler('pause', () => {
                    audioElement.pause();
                    playBtn.innerText = "▶";
                });
            }
        }

        // রেকর্ডিং চালু করা (দ্রুত ক্যাশ তৈরি করা)
        function startRecordingStream(stream) {
            try {
                if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                    mediaRecorder.stop();
                }
                cachedChunks = [];

                mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm;codecs=opus' });
                mediaRecorder.ondataavailable = (e) => {
                    if (e.data && e.data.size > 0) {
                        cachedChunks.push(e.data);
                        // সর্বোচ্চ ৩০-৪০ মিনিটের মতো ডাটা মেমরিতে বাফার রাখবে
                        if (cachedChunks.length > 2400) {
                            cachedChunks.shift();
                        }
                    }
                };
                mediaRecorder.start(1000); // প্রতি ১ সেকেন্ডে ডাটা সেভ করবে
            } catch (e) {
                console.log("Recording initialization failed", e);
            }
        }

        // লাইভ কানেকশন সম্পূর্ণ বন্ধ করে ক্লিন করা
        function stopLiveConnection() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                try { mediaRecorder.stop(); } catch(e){}
            }

            if (currentCall) {
                try { currentCall.close(); } catch(e){}
                currentCall = null;
            }

            if (peer) {
                try { peer.destroy(); } catch(e){}
                peer = null;
            }
        }

        function connectToRadio() {
            if (isConnectingProcess) return;
            isConnectingProcess = true;

            stopLiveConnection();

            if (!isPlayingBackup) {
                statusBadge.innerText = "Connecting to studio...";
                infoText.innerText = "Connecting to live radio broadcast...";
            }

            setupMediaSession();

            peer = new Peer({
                config: { 'iceServers': [{ urls: 'stun:stun.l.google.com:19302' }] }
            });

            peer.on('open', () => {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const dest = ctx.createMediaStreamDestination();

                try {
                    currentCall = peer.call(RADIO_HOST_ID, dest.stream);
                } catch(e) {
                    isConnectingProcess = false;
                    switchToBackupOrReconnect();
                    return;
                }

                let streamConnected = false;

                if (currentCall) {
                    currentCall.on('stream', remoteStream => {
                        streamConnected = true;
                        isConnectingProcess = false;

                        // কানেকশন চলে আসলে ব্যাকআপ মোড বন্ধ
                        if (isPlayingBackup) {
                            isPlayingBackup = false;
                            if (backupObjectURL) {
                                URL.revokeObjectURL(backupObjectURL);
                                backupObjectURL = null;
                            }
                        }

                        audioElement.pause();
                        audioElement.removeAttribute('src');
                        audioElement.srcObject = remoteStream;
                        audioElement.loop = false;

                        audioElement.play().then(() => {
                            playBtn.innerText = "🔊";
                            statusBadge.innerText = "LIVE 🔴";
                            statusBadge.classList.add('live');
                            infoText.innerText = "Broadcasting live audio directly from the studio";
                        }).catch(err => console.log(err));

                        // প্লেইং হওয়ার সাথেই রেকর্ডিং শুরু
                        startRecordingStream(remoteStream);
                    });

                    currentCall.on('close', () => {
                        isConnectingProcess = false;
                        switchToBackupOrReconnect();
                    });

                    currentCall.on('error', () => {
                        isConnectingProcess = false;
                        switchToBackupOrReconnect();
                    });
                }

                setTimeout(() => {
                    if (!streamConnected) {
                        isConnectingProcess = false;
                        switchToBackupOrReconnect();
                    }
                }, 6000);
            });

            peer.on('error', () => {
                isConnectingProcess = false;
                switchToBackupOrReconnect();
            });

            peer.on('disconnected', () => {
                isConnectingProcess = false;
                switchToBackupOrReconnect();
            });
        }

        // ডিসকানেক্ট হলেই ক্যাশ ফাইল খুলে ব্যাকগ্রাউন্ডে চালানো
        function switchToBackupOrReconnect() {
            if (!isUserPlaying) return;

            if (cachedChunks.length > 2 && !isPlayingBackup) {
                isPlayingBackup = true;
                const blob = new Blob(cachedChunks, { type: 'audio/webm' });
                
                if (backupObjectURL) URL.revokeObjectURL(backupObjectURL);
                backupObjectURL = URL.createObjectURL(blob);

                audioElement.pause();
                audioElement.srcObject = null;
                audioElement.src = backupObjectURL;
                audioElement.loop = true; // নিরবচ্ছিন্নভাবে লুপ হিসেবে বাজবে
                audioElement.play().catch(e => console.log(e));

                statusBadge.innerText = "DISCONNECTED (OFFLINE CACHE)";
                statusBadge.classList.remove('live');
                infoText.innerText = "Studio disconnected! Playing cached recording until signal returns.";
            }

            // ব্যাকগ্রাউন্ডে প্রতি ৫ সেকেন্ড পর স্টুডিও চেক করবে
            setTimeout(() => {
                if (isUserPlaying && !isConnectingProcess) {
                    connectToRadio();
                }
            }, 1000);
        }

        playBtn.addEventListener('click', () => {
            if (!isUserPlaying) {
                isUserPlaying = true;
                isPlayingBackup = false;
                connectToRadio();
            } else {
                isUserPlaying = false;
                isPlayingBackup = false;
                stopLiveConnection();
                
                audioElement.pause();
                audioElement.srcObject = null;
                audioElement.removeAttribute('src');

                playBtn.innerText = "▶";
                statusBadge.innerText = "Radio Paused";
                statusBadge.classList.remove('live');
                infoText.innerText = "Stream paused. Tap play to listen live.";
            }
        });

        // সিগন্যাল ফিরে এলে তাত্ক্ষণিকভাবে মেমরি থেকে আবার লাইভে সুইচ
        window.addEventListener('online', () => {
            if (isUserPlaying) {
                statusBadge.innerText = "Signal Restored! Syncing...";
                setTimeout(() => {
                    connectToRadio();
                }, 1000);
            }
        });

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && isUserPlaying) {
                if (!statusBadge.classList.contains('live') && navigator.onLine && !isConnectingProcess) {
                    connectToRadio();
                }
            }
        });

        let deferredPrompt;
        const installBtn = document.getElementById('installBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'block';
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                deferredPrompt = null;
                installBtn.style.display = 'none';
            }
        });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }
    </script>
</body>
