    <script>
        const RADIO_HOST_ID = 'low_bw_radio_station_node_1';
        let peer;
        const playBtn = document.getElementById('play-btn');
        const statusBadge = document.getElementById('status-badge');
        const infoText = document.getElementById('info-text');

        peer = new Peer({
            config: { 'iceServers': [{ urls: 'stun:stun.l.google.com:19302' }] }
        });

        peer.on('open', () => {
            statusBadge.innerText = "Radio Tuned (Ready)";
        });

        playBtn.addEventListener('click', connectToRadio);

        function connectToRadio() {
            statusBadge.innerText = "Connecting to studio...";
            
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const dest = ctx.createMediaStreamDestination();

            const call = peer.call(RADIO_HOST_ID, dest.stream);

            if (call) {
                call.on('stream', remoteStream => {
                    const audio = new Audio();
                    audio.srcObject = remoteStream;
                    audio.play();

                    playBtn.innerText = "🔊";
                    statusBadge.innerText = "LIVE 🔴";
                    statusBadge.classList.add('live');
                    infoText.innerText = "Broadcasting live audio directly from the studio";
                });
            }

            setTimeout(() => {
                if (!statusBadge.classList.contains('live')) {
                    statusBadge.innerText = "Studio Offline";
                    infoText.innerText = "Broadcast is currently offline from the studio.";
                }
            }, 4000);
        }

        let deferredPrompt;
        const installBtn = document.getElementById('installBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'block';
        });

        installBtn.addEventListener('click', () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        installBtn.style.display = 'none';
                    }
                    deferredPrompt = null;
                });
            }
        });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }
   





  // ব্রাউজার ইন্সটল করার উপযুক্ত হলে বোতামটি দেখাবে
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.style.display = 'inline-block'; 
  });

  // বোতামে ক্লিক করলে ইন্সটল ডায়ালগ চালু হবে
  installBtn.addEventListener('click', async () => {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      deferredPrompt = null;
      installBtn.style.display = 'none';
    }
  });





 </script>
